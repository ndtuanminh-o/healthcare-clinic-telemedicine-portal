<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic Portal - Booking</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
  header { background: #0b6e4f; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 20px; }
  nav a { color: #fff; text-decoration: none; margin-left: 16px; font-size: 14px; opacity: 0.85; }
  nav a:hover, nav a.active { opacity: 1; font-weight: bold; text-decoration: underline; }
  main { display: grid; grid-template-columns: 1fr 1.3fr; gap: 20px; padding: 20px 24px; }
  section { background: #fff; border: 1px solid #d5dbe0; border-radius: 6px; padding: 16px; }
  h2 { margin-top: 0; font-size: 17px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
  th, td { border-bottom: 1px solid #e3e7ea; padding: 6px 8px; text-align: left; }
  label { display: block; margin-top: 10px; font-size: 14px; }
  input, textarea, select { width: 100%; box-sizing: border-box; padding: 6px; font: inherit; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  button { margin-top: 14px; padding: 8px 14px; background: #0b6e4f; color: #fff; border: 0; border-radius: 4px; cursor: pointer; width: 100%; font-size: 14px; }
  button:hover { background: #08533c; }
  #msg { margin-top: 12px; font-size: 14px; padding: 8px 12px; border-radius: 4px; display: none; }
  #msg.success { background: #e8f5e9; color: #1b5e20; border: 1px solid #c8e6c9; display: block; }
  #msg.error { background: #ffebee; color: #b71c1c; border: 1px solid #ffcdd2; display: block; }
  .tag { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 12px; }
  .tag-tele { background: #e0f2fe; color: #0369a1; }
  .tag-inperson { background: #f1f5f9; color: #475569; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Clinic Portal</h1>
  <nav>
    <a href="/booking" class="active">Booking</a>
    <a href="/doctor">Doctor screen</a>
    <a href="/dashboard">Dashboard</a>
  </nav>
</header>

<main>
  <section>
    <h2>Book appointment</h2>
    <form id="bookingForm" onsubmit="submitBooking(event)">
      <label>Full name *<input id="full_name" required placeholder="John Doe"></label>
      <div class="two">
        <label>Phone number *<input id="phone_number" required placeholder="0901234567"></label>
        <label>Date of birth *<input id="date_of_birth" type="date" required></label>
      </div>
      <div class="two">
        <label>Gender
          <select id="gender">
            <option value="M">Male</option>
            <option value="F">Female</option>
            <option value="O" selected>Other</option>
          </select>
        </label>
        <label>Residential address<input id="address" placeholder="123 Medical Center Blvd"></label>
      </div>
      <label>Doctor *
        <select id="doctor_id" required>
          <option value="">Select doctor</option>
        </select>
      </label>
      <div class="three">
        <label>Date *<input id="appointment_date" type="date" required></label>
        <label>Start time *<input id="start_time" type="time" required></label>
        <label>End time *<input id="end_time" type="time" required></label>
      </div>
      <div class="two">
        <label>Consultation type
          <select id="consultation_type" onchange="toggleVideoLink()">
            <option value="In-Person">In-Person</option>
            <option value="Telemedicine">Telemedicine</option>
          </select>
        </label>
        <label id="videoField" style="display:none">Video room link
          <input id="telemedicine_video_link" placeholder="https://meet.google.com/xyz">
        </label>
      </div>
      <label>Reason for visit / symptoms
        <textarea id="reason_for_visit" rows="2" placeholder="Routine check-up, headache..."></textarea>
      </label>
      <button type="submit">Confirm appointment</button>
      <div id="msg"></div>
    </form>
  </section>

  <section>
    <h2>Recent appointments</h2>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Time</th>
          <th>Patient</th>
          <th>Doctor</th>
          <th>Type</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="appointments">
        <tr><td colspan="6" style="text-align:center;color:#888;">Loading...</td></tr>
      </tbody>
    </table>
  </section>
</main>

<script>
  function toggleVideoLink() {
    const type = document.getElementById("consultation_type").value;
    document.getElementById("videoField").style.display = type === "Telemedicine" ? "block" : "none";
  }

  function showMessage(text, isError) {
    const el = document.getElementById("msg");
    el.className = isError ? "error" : "success";
    el.textContent = text;
  }

  async function loadDoctors() {
    try {
      const res = await fetch("/api/doctors");
      const docs = await res.json();
      const sel = document.getElementById("doctor_id");
      sel.innerHTML = '<option value="">Select doctor</option>';
      docs.forEach(function (d) {
        const opt = document.createElement("option");
        opt.value = d.doctor_id;
        opt.textContent = d.full_name;
        sel.appendChild(opt);
      });
    } catch (e) {
      console.error(e);
    }
  }

  async function loadAppointments() {
    try {
      const res = await fetch("/api/appointments/recent");
      const appts = await res.json();
      const tbody = document.getElementById("appointments");
      tbody.innerHTML = "";
      if (!appts || appts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#888;">No appointments found.</td></tr>';
        return;
      }
      appts.forEach(function (a) {
        const tr = document.createElement("tr");
        const badgeClass = a.consultation_type === "Telemedicine" ? "tag tag-tele" : "tag tag-inperson";
        tr.innerHTML = `
          <td>${a.appointment_date || ""}</td>
          <td>${a.start_time || ""} - ${a.end_time || ""}</td>
          <td>${a.patient_name || ""}<br><small style="color:#666">${a.phone_number || ""}</small></td>
          <td>${a.doctor_name || ""}</td>
          <td><span class="${badgeClass}">${a.consultation_type || ""}</span></td>
          <td>${a.status || ""}</td>
        `;
        tbody.appendChild(tr);
      });
    } catch (e) {
      console.error(e);
    }
  }

  async function submitBooking(event) {
    event.preventDefault();
    const payload = {
      full_name: document.getElementById("full_name").value,
      phone_number: document.getElementById("phone_number").value,
      date_of_birth: document.getElementById("date_of_birth").value,
      gender: document.getElementById("gender").value,
      address: document.getElementById("address").value,
      doctor_id: document.getElementById("doctor_id").value,
      appointment_date: document.getElementById("appointment_date").value,
      start_time: document.getElementById("start_time").value,
      end_time: document.getElementById("end_time").value,
      consultation_type: document.getElementById("consultation_type").value,
      telemedicine_video_link: document.getElementById("telemedicine_video_link").value,
      reason_for_visit: document.getElementById("reason_for_visit").value
    };

    try {
      const res = await fetch("/api/appointments", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) {
        showMessage(data.error || "Failed to book appointment", true);
        return;
      }
      showMessage(data.message || "Appointment booked successfully", false);
      document.getElementById("bookingForm").reset();
      toggleVideoLink();
      loadAppointments();
    } catch (err) {
      showMessage("Error: " + err.message, true);
    }
  }

  loadDoctors();
  loadAppointments();
</script>
</body>
</html>
